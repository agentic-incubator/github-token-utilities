name: Links

# External links rot on their own schedule, so check them weekly and whenever docs change on
# main. Not run on pull requests: a flaky third-party site shouldn't block a merge.
# Internal links are checked on every push and PR by `npm test` (tests/docs.test.mjs).
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  push:
    branches: [main]
    paths: ['**.md', 'skills/**', 'scripts/check-links.mjs']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    name: External links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run check:links
