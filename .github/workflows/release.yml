name: Release

# Push a tag that matches package.json to publish a GitHub Release:
#   git tag v3.1.0 && git push origin v3.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Publish release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # sign build provenance
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Fails unless the tag equals v<package.json version> and docs/CHANGELOG.md has that section.
      - name: Build release assets
        run: node scripts/package-release.mjs --check-tag "$GITHUB_REF_NAME"

      # Signed SLSA build provenance; verify with: gh attestation verify <file> -R <owner>/<repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tgz
            release/*.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            release/*.tgz release/*.zip release/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes-file release/RELEASE_NOTES.md \
            --verify-tag $prerelease
